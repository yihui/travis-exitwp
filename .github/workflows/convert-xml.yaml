on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: convert-xml

jobs:
  convert-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install"
        run: |
          git clone --depth=1 https://github.com/omajid/exitwp-for-hugo.git
          sudo apt -qq -y install libxml2-utils > /dev/null
          cd exitwp-for-hugo
          # PyYAML 3.10 doesn't build on modern Python
          sed -i 's/^PyYAML==.*/PyYAML>=5.4/' pip_requirements.txt
          pip install --upgrade -r pip_requirements.txt
          ../build.sh

      - name: "Zip files"
        run: |
          [ -f build.zip ] || exit 0
          curl -F "file=@build.zip" https://file.io
